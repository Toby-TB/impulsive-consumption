<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1200px;height:400px;overflow:hidden;background:linear-gradient(135deg,#1B1020 0%,#3B1550 45%,#8A1E4E 75%,#E8590C 130%);font-family:'DejaVu Sans',sans-serif;color:#fff}
.orb{position:absolute;border-radius:50%}
.o1{width:360px;height:360px;left:-100px;top:-130px;background:radial-gradient(circle,rgba(255,107,157,.55),rgba(255,107,157,0))}
.o2{width:440px;height:440px;right:-130px;bottom:-170px;background:radial-gradient(circle,rgba(255,197,61,.5),rgba(255,197,61,0))}
.o3{width:270px;height:270px;right:320px;top:-95px;background:radial-gradient(circle,rgba(106,90,255,.5),rgba(106,90,255,0))}
.o4{width:200px;height:200px;left:400px;bottom:-90px;background:radial-gradient(circle,rgba(232,89,12,.45),rgba(232,89,12,0))}
.txt{position:absolute;left:60px;top:78px;width:590px;z-index:2}
h1{margin:0;font-size:62px;line-height:1.02;font-weight:900;letter-spacing:-1.5px}
h1 .accent{background:linear-gradient(90deg,#FFC53D,#FF6B9D);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:18px;font-size:19px;color:rgba(255,255,255,.8);font-weight:600;letter-spacing:1.2px;white-space:nowrap}
.pill{display:inline-block;margin-top:26px;padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.35);font-size:15px;font-weight:700}
.imgs{position:absolute;right:28px;top:36px;width:500px;height:328px;z-index:1}
.imgs img{position:absolute;object-fit:contain;filter:drop-shadow(0 26px 36px rgba(0,0,0,.55))}
.p1{width:226px;height:226px;right:6px;top:36px;transform:rotate(-4deg)}
.p2{width:180px;height:180px;right:172px;top:108px;transform:rotate(5deg)}
.p3{width:128px;height:128px;right:52px;top:196px;transform:rotate(-7deg)}
</style></head><body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="orb o4"></div>
<div class="txt">
  <h1>BUY IT ALL.<br><span class="accent">REGRET TOMORROW.</span></h1>
  <div class="sub">REAL PRODUCTS · SIMULATED WALLET · 100% OFFLINE</div>
  <span class="pill">IMPULSIVE CONSUMPTION</span>
</div>
<div class="imgs">
  <img class="p1" src="../real_src/ps5-slim.raw.png">
  <img class="p2" src="../real_src/nvidia-rtx-4090.raw.png">
  <img class="p3" src="../real_src/centella-cream.raw.png">
</div>
</body></html>
